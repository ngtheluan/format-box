<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Base64 Encode / Decode | FormatBox</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--font:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;--accent:#6366f1;--radius:10px}
    [data-theme="dark"]{--bg:#0c1017;--bg2:#151b27;--bg3:#1c2333;--text:#c9d1d9;--dim:#6b7b90;--bright:#f0f4f8;--border:rgba(255,255,255,.06);--glow:rgba(99,102,241,.08);--err:#ef4444;--ok:#22c55e}
    [data-theme="light"]{--bg:#f5f7fa;--bg2:#fff;--bg3:#eef1f6;--text:#3a4555;--dim:#7a8599;--bright:#111827;--border:rgba(0,0,0,.08);--glow:rgba(99,102,241,.06);--err:#dc2626;--ok:#16a34a}
    body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;min-height:100vh}a{color:inherit;text-decoration:none}

    .nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
    .logo{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
    .logo svg{width:28px;height:28px;transition:transform .5s}.logo svg rect{fill:none;stroke:var(--accent);stroke-width:2;rx:4}.logo svg line{stroke:var(--accent);stroke-width:1.5;opacity:.4}
    [data-theme="light"] .logo svg{transform:rotate(180deg)}
    .logo b{font-size:1.15rem;font-weight:700;color:var(--bright)}.logo b span{color:var(--accent)}
    .nav-r{display:flex;align-items:center;gap:16px;font-size:.82rem;color:var(--dim)}.nav-r a:hover{color:var(--accent)}
    .theme-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--bg3);color:var(--dim);font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1}
    .theme-btn:hover{border-color:var(--accent);color:var(--accent)}

    .page{padding:80px 24px 60px;max-width:1040px;margin:0 auto}
    h1{font-size:1.6rem;font-weight:700;color:var(--bright);margin-bottom:6px;letter-spacing:-.02em}
    h1 span{color:var(--accent)}
    .sub{color:var(--dim);font-size:.9rem;margin-bottom:28px}

    /* CARD */
    .tool-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:24px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border)}
    .toolbar-actions{display:flex;gap:8px}
    .icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--bg3);color:var(--dim);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .icon-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}

    .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
    .col label{margin-top:0}
    .col textarea{height:260px}

    .tabs{display:flex;gap:4px}
    .tab{padding:8px 20px;border-radius:100px;font-family:var(--font);font-size:.85rem;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;transition:all .15s}
    .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

    .area{position:relative}
    textarea{width:100%;height:180px;padding:16px;font-family:var(--mono);font-size:.85rem;line-height:1.6;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);resize:vertical;transition:border-color .15s,box-shadow .15s,color .15s;outline:none}
    textarea:focus{border-color:var(--accent)}
    textarea::placeholder{color:var(--dim)}
    label{display:block;font-size:.8rem;font-weight:600;color:var(--dim);margin-bottom:8px;margin-top:0}

    /* Kết quả: chữ sáng, rõ hơn textarea input; đổi màu viền theo trạng thái */
    .output-area{background:var(--bg2);color:var(--bright);font-weight:500}
    .output-area.state-ok{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
    .output-area.state-err{border-color:var(--err);color:var(--err);box-shadow:0 0 0 1px var(--err) inset}

    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .btn{padding:10px 22px;border-radius:100px;font-family:var(--font);font-size:.85rem;font-weight:600;border:none;cursor:pointer;transition:transform .1s,opacity .15s}
    .btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(0)}
    .btn-p{background:var(--accent);color:#fff}
    .btn-s{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
    .btn-s:hover{border-color:var(--accent);color:var(--accent)}

    .convert-row{display:flex;justify-content:center;margin-top:22px}
    .btn-lg{padding:13px 44px;font-size:.95rem;box-shadow:0 8px 20px -8px var(--accent)}

    .drop-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:18px;text-align:center;color:var(--dim);font-size:.85rem;cursor:pointer;transition:border-color .2s,background .2s;margin-top:12px}
    .drop-zone:hover,.drop-zone.drag{border-color:var(--accent);background:var(--glow)}
    .drop-zone input{display:none}

    .info{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px;font-size:.78rem;font-family:var(--mono);color:var(--dim)}
    .info-item{padding:4px 10px;background:var(--bg3);border-radius:6px}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);padding:10px 20px;border-radius:100px;font-size:.84rem;font-weight:500;background:var(--ok);color:#fff;opacity:0;transition:all .3s;pointer-events:none;z-index:200}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    .ft{border-top:1px solid var(--border);padding:32px 24px;text-align:center;font-size:.78rem;color:var(--dim);margin-top:60px}
    @media(max-width:820px){.cols{grid-template-columns:1fr}.col textarea{height:180px}}
    @media(max-width:640px){.nav-r a{display:none}.page{padding:70px 16px 40px}.tool-card{padding:18px}}
  </style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="logo">
    <svg viewBox="0 0 28 28"><rect x="2" y="2" width="24" height="24"/><line x1="2" y1="14" x2="26" y2="14"/><line x1="14" y1="2" x2="14" y2="26"/></svg>
    <b>Format<span>Box</span></b>
  </a>
  <div class="nav-r"><a href="image-converter.html">Image</a><a href="json-formatter.html">JSON</a><button class="theme-btn" id="themeToggle" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện">🌙</button></div>
</nav>

<div class="page">
  <h1>🔐 Base64 <span>Encode / Decode</span></h1>
  <p class="sub">Mã hóa hoặc giải mã Base64. Hỗ trợ text UTF-8 và file. Xử lý ngay trên trình duyệt.</p>

  <div class="tool-card">
    <div class="toolbar">
      <div class="tabs">
        <button class="tab active" data-mode="encode">Encode</button>
        <button class="tab" data-mode="decode">Decode</button>
      </div>
      <div class="toolbar-actions">
        <button class="icon-btn" id="swapBtn" title="Đổi chiều">⇅</button>
        <button class="icon-btn" id="clearBtn" title="Xóa">🗑</button>
      </div>
    </div>

    <div class="cols">
      <div class="col">
        <label id="inputLabel">Nhập text cần encode</label>
        <textarea id="input" placeholder="Paste text vào đây..."></textarea>
        <div class="drop-zone" id="dropZone">
          <span>📎 Kéo thả file vào đây hoặc <u>chọn file</u></span>
          <input type="file" id="fileInput"/>
        </div>
      </div>
      <div class="col">
        <label>Kết quả</label>
        <textarea id="output" class="output-area" readonly placeholder="Kết quả sẽ hiện ở đây..."></textarea>
        <div class="actions">
          <button class="btn btn-s" id="copyBtn">📋 Copy</button>
          <button class="btn btn-s" id="downloadBtn">💾 Tải file</button>
        </div>
      </div>
    </div>

    <div class="convert-row">
      <button class="btn btn-p btn-lg" id="convertBtn">Encode →</button>
    </div>

    <div class="info" id="info"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<footer class="ft">&copy; 2026 FormatBox</footer>

<script>
let mode = 'encode';
const input = document.getElementById('input');
const output = document.getElementById('output');
const convertBtn = document.getElementById('convertBtn');
const infoEl = document.getElementById('info');

function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg;
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000);
}

function updateLabels() {
  document.getElementById('inputLabel').textContent = mode === 'encode' ? 'Nhập text cần encode' : 'Nhập Base64 cần decode';
  convertBtn.textContent = mode === 'encode' ? 'Encode →' : 'Decode →';
  input.placeholder = mode === 'encode' ? 'Paste text vào đây...' : 'Paste Base64 vào đây...';
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelector('.tab.active').classList.remove('active');
    tab.classList.add('active');
    mode = tab.dataset.mode;
    updateLabels();
  });
});

document.getElementById('swapBtn').addEventListener('click', () => {
  const tmp = input.value; input.value = output.value; output.value = '';
  output.classList.remove('state-ok', 'state-err');
  mode = mode === 'encode' ? 'decode' : 'encode';
  document.querySelector('.tab.active').classList.remove('active');
  document.querySelector(`.tab[data-mode="${mode}"]`).classList.add('active');
  updateLabels();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  input.value = ''; output.value = ''; infoEl.innerHTML = '';
  output.classList.remove('state-ok', 'state-err');
});

convertBtn.addEventListener('click', () => {
  const val = input.value;
  if (!val.trim()) { toast('Chưa có dữ liệu'); return; }
  try {
    if (mode === 'encode') {
      const encoded = btoa(unescape(encodeURIComponent(val)));
      output.value = encoded;
      infoEl.innerHTML = `<span class="info-item">Input: ${new Blob([val]).size} bytes</span><span class="info-item">Output: ${encoded.length} chars</span>`;
    } else {
      const decoded = decodeURIComponent(escape(atob(val.trim())));
      output.value = decoded;
      infoEl.innerHTML = `<span class="info-item">Input: ${val.trim().length} chars</span><span class="info-item">Output: ${new Blob([decoded]).size} bytes</span>`;
    }
    output.classList.remove('state-err'); output.classList.add('state-ok');
  } catch (e) {
    output.value = ''; toast('Lỗi: dữ liệu không hợp lệ');
    infoEl.innerHTML = `<span class="info-item" style="color:var(--err)">Invalid ${mode === 'decode' ? 'Base64' : 'input'}</span>`;
    output.classList.remove('state-ok'); output.classList.add('state-err');
  }
});

document.getElementById('copyBtn').addEventListener('click', () => {
  if (!output.value) return;
  navigator.clipboard.writeText(output.value).then(() => toast('Đã copy'));
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  if (!output.value) return;
  const blob = new Blob([output.value], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = mode === 'encode' ? 'encoded.txt' : 'decoded.txt';
  a.click(); URL.revokeObjectURL(a.href);
});

// FILE DROP
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag'); handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(file) {
  const reader = new FileReader();
  if (mode === 'encode') {
    reader.onload = () => {
      const base64 = reader.result.split(',')[1];
      input.value = `[file: ${file.name}]`;
      output.value = base64;
      output.classList.remove('state-err'); output.classList.add('state-ok');
      infoEl.innerHTML = `<span class="info-item">${file.name}</span><span class="info-item">${(file.size/1024).toFixed(1)} KB → ${base64.length} chars</span>`;
    };
    reader.readAsDataURL(file);
  } else {
    reader.onload = () => { input.value = reader.result; };
    reader.readAsText(file);
  }
}

// THEME
const themeBtn = document.getElementById('themeToggle'), html = document.documentElement;
const saved = localStorage.getItem('fb-theme'); if (saved) html.dataset.theme = saved;
function updateThemeIcon() { themeBtn.textContent = html.dataset.theme === 'dark' ? '☀️' : '🌙'; }
updateThemeIcon();
themeBtn.addEventListener('click', () => { const n = html.dataset.theme === 'dark' ? 'light' : 'dark'; html.dataset.theme = n; localStorage.setItem('fb-theme', n); updateThemeIcon(); });
</script>
</body>
</html>
