<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Image Converter | FormatBox</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--font:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;--accent:#6366f1;--radius:10px}
    [data-theme="dark"]{--bg:#0c1017;--bg2:#151b27;--bg3:#1c2333;--text:#c9d1d9;--dim:#6b7b90;--bright:#f0f4f8;--border:rgba(255,255,255,.06);--glow:rgba(99,102,241,.08);--ok:#22c55e}
    [data-theme="light"]{--bg:#f5f7fa;--bg2:#fff;--bg3:#eef1f6;--text:#3a4555;--dim:#7a8599;--bright:#111827;--border:rgba(0,0,0,.08);--glow:rgba(99,102,241,.06);--ok:#16a34a}
    body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;min-height:100vh}a{color:inherit;text-decoration:none}
    .nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
    .logo{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}.logo svg{width:28px;height:28px;transition:transform .5s}.logo svg rect{fill:none;stroke:var(--accent);stroke-width:2;rx:4}.logo svg line{stroke:var(--accent);stroke-width:1.5;opacity:.4}[data-theme="light"] .logo svg{transform:rotate(180deg)}.logo b{font-size:1.15rem;font-weight:700;color:var(--bright)}.logo b span{color:var(--accent)}
    .nav-r{display:flex;align-items:center;gap:16px;font-size:.82rem;color:var(--dim)}.nav-r a:hover{color:var(--accent)}
    .theme-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--bg3);color:var(--dim);font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1}
    .theme-btn:hover{border-color:var(--accent);color:var(--accent)}

    .page{padding:80px 24px 60px;max-width:800px;margin:0 auto}
    h1{font-size:1.6rem;font-weight:700;color:var(--bright);margin-bottom:6px}h1 span{color:var(--accent)}
    .sub{color:var(--dim);font-size:.9rem;margin-bottom:28px}

    .drop{border:2px dashed var(--border);border-radius:var(--radius);padding:48px 24px;text-align:center;color:var(--dim);font-size:.9rem;cursor:pointer;transition:border-color .2s,background .2s}
    .drop:hover,.drop.drag{border-color:var(--accent);background:var(--glow)}
    .drop input{display:none}
    .drop-icon{font-size:2.5rem;margin-bottom:12px}

    .controls{display:none;margin-top:24px}
    .controls.show{display:block}
    label{display:block;font-size:.8rem;font-weight:600;color:var(--dim);margin-bottom:6px;margin-top:16px}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

    .fmt-btn{padding:8px 20px;border-radius:100px;font-family:var(--font);font-size:.85rem;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;transition:all .15s}
    .fmt-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

    .slider-wrap{margin-top:8px;display:flex;align-items:center;gap:12px}
    .slider-wrap input[type=range]{flex:1;accent-color:var(--accent)}
    .slider-val{font-family:var(--mono);font-size:.85rem;color:var(--bright);min-width:40px}

    .preview-area{display:none;margin-top:24px;gap:16px}
    .preview-area.show{display:grid;grid-template-columns:1fr 1fr}
    .preview-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center;overflow:hidden}
    .preview-box img{max-width:100%;max-height:240px;border-radius:6px;object-fit:contain}
    .preview-label{font-size:.75rem;font-family:var(--mono);color:var(--dim);margin-top:8px}

    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
    .btn{padding:10px 22px;border-radius:100px;font-family:var(--font);font-size:.85rem;font-weight:600;border:none;cursor:pointer;transition:transform .1s}.btn:hover{transform:translateY(-1px)}
    .btn-p{background:var(--accent);color:#fff}.btn-s{background:var(--bg3);color:var(--text);border:1px solid var(--border)}.btn-s:hover{border-color:var(--accent);color:var(--accent)}

    .info{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:.78rem;font-family:var(--mono);color:var(--dim)}.info-i{padding:4px 10px;background:var(--bg3);border-radius:6px}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);padding:10px 20px;border-radius:100px;font-size:.84rem;font-weight:500;background:var(--ok);color:#fff;opacity:0;transition:all .3s;pointer-events:none;z-index:200}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    .ft{border-top:1px solid var(--border);padding:32px 24px;text-align:center;font-size:.78rem;color:var(--dim);margin-top:60px}
    @media(max-width:640px){.nav-r a{display:none}.page{padding:70px 16px 40px}.preview-area.show{grid-template-columns:1fr}}
  </style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="logo"><svg viewBox="0 0 28 28"><rect x="2" y="2" width="24" height="24"/><line x1="2" y1="14" x2="26" y2="14"/><line x1="14" y1="2" x2="14" y2="26"/></svg><b>Format<span>Box</span></b></a>
  <div class="nav-r"><a href="base64.html">Base64</a><a href="json-formatter.html">JSON</a><button class="theme-btn" id="themeToggle" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện">🌙</button></div>
</nav>

<div class="page">
  <h1>🖼️ Image <span>Converter</span></h1>
  <p class="sub">Chuyển đổi giữa PNG, JPG, WebP. Kéo thả ảnh, chỉnh chất lượng, tải về.</p>

  <div class="drop" id="drop">
    <div class="drop-icon">📎</div>
    <span>Kéo thả ảnh vào đây hoặc <u>chọn file</u></span><br/>
    <small style="color:var(--dim);margin-top:8px;display:block">PNG, JPG, WebP, GIF, BMP</small>
    <input type="file" id="fileInput" accept="image/*"/>
  </div>

  <div class="controls" id="controls">
    <label>Chuyển sang</label>
    <div class="row">
      <button class="fmt-btn active" data-fmt="image/png">PNG</button>
      <button class="fmt-btn" data-fmt="image/jpeg">JPG</button>
      <button class="fmt-btn" data-fmt="image/webp">WebP</button>
    </div>

    <label>Chất lượng <span id="qualityShow" style="display:none">(chỉ JPG/WebP)</span></label>
    <div class="slider-wrap">
      <input type="range" id="quality" min="10" max="100" value="85"/>
      <span class="slider-val" id="qualityVal">85%</span>
    </div>

    <div class="actions">
      <button class="btn btn-p" id="convertBtn">Chuyển đổi</button>
      <button class="btn btn-s" id="resetBtn">Chọn ảnh khác</button>
    </div>
  </div>

  <div class="preview-area" id="preview">
    <div class="preview-box">
      <img id="origImg"/><div class="preview-label" id="origInfo">Original</div>
    </div>
    <div class="preview-box">
      <img id="convImg"/><div class="preview-label" id="convInfo">Converted</div>
    </div>
  </div>

  <div class="actions" id="dlActions" style="display:none">
    <a class="btn btn-p" id="downloadBtn">💾 Tải ảnh</a>
  </div>
  <div class="info" id="info"></div>
</div>

<div class="toast" id="toast"></div>
<footer class="ft">&copy; 2026 FormatBox</footer>

<script>
let origFile=null,origDataUrl=null,targetFmt='image/png';
const drop=document.getElementById('drop'),fileInput=document.getElementById('fileInput'),controls=document.getElementById('controls'),previewEl=document.getElementById('preview'),qualityInput=document.getElementById('quality'),qualityVal=document.getElementById('qualityVal'),qualityShow=document.getElementById('qualityShow');

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function fmtSize(b){return b>1048576?(b/1048576).toFixed(2)+' MB':(b/1024).toFixed(1)+' KB'}

drop.addEventListener('click',()=>fileInput.click());
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});
drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');loadFile(e.dataTransfer.files[0])});
fileInput.addEventListener('change',e=>{if(e.target.files[0])loadFile(e.target.files[0])});

function loadFile(file){
  if(!file.type.startsWith('image/')){toast('Chỉ hỗ trợ file ảnh');return}
  origFile=file;
  const reader=new FileReader();
  reader.onload=()=>{
    origDataUrl=reader.result;
    document.getElementById('origImg').src=origDataUrl;
    document.getElementById('origInfo').textContent=`${file.name} · ${fmtSize(file.size)} · ${file.type.split('/')[1].toUpperCase()}`;
    controls.classList.add('show');
    drop.style.display='none';
    previewEl.classList.remove('show');
    document.getElementById('dlActions').style.display='none';
  };
  reader.readAsDataURL(file);
}

document.querySelectorAll('.fmt-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelector('.fmt-btn.active').classList.remove('active');
    btn.classList.add('active');
    targetFmt=btn.dataset.fmt;
    qualityShow.style.display=targetFmt==='image/png'?'none':'inline';
  });
});

qualityInput.addEventListener('input',()=>{qualityVal.textContent=qualityInput.value+'%'});

document.getElementById('convertBtn').addEventListener('click',()=>{
  if(!origDataUrl)return;
  const img=new Image();
  img.onload=()=>{
    const canvas=document.createElement('canvas');
    canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
    const ctx=canvas.getContext('2d');
    if(targetFmt==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height)}
    ctx.drawImage(img,0,0);
    const q=targetFmt==='image/png'?undefined:qualityInput.value/100;
    const dataUrl=canvas.toDataURL(targetFmt,q);
    document.getElementById('convImg').src=dataUrl;
    const ext=targetFmt.split('/')[1]==='jpeg'?'jpg':targetFmt.split('/')[1];
    const convSize=Math.round(dataUrl.length*3/4);
    document.getElementById('convInfo').textContent=`converted.${ext} · ${fmtSize(convSize)} · ${ext.toUpperCase()}`;
    previewEl.classList.add('show');

    const dlBtn=document.getElementById('downloadBtn');
    dlBtn.href=dataUrl;dlBtn.download=`converted.${ext}`;
    document.getElementById('dlActions').style.display='flex';

    const reduction=((1-convSize/origFile.size)*100).toFixed(0);
    document.getElementById('info').innerHTML=`<span class="info-i">${img.naturalWidth}×${img.naturalHeight}</span><span class="info-i">${fmtSize(origFile.size)} → ${fmtSize(convSize)}</span><span class="info-i">${reduction>0?reduction+'% nhỏ hơn':Math.abs(reduction)+'% lớn hơn'}</span>`;
  };
  img.src=origDataUrl;
});

document.getElementById('resetBtn').addEventListener('click',()=>{
  origFile=null;origDataUrl=null;
  controls.classList.remove('show');previewEl.classList.remove('show');
  document.getElementById('dlActions').style.display='none';
  document.getElementById('info').innerHTML='';
  drop.style.display='';fileInput.value='';
});

const themeBtn=document.getElementById('themeToggle'),html=document.documentElement,saved=localStorage.getItem('fb-theme');
if(saved)html.dataset.theme=saved;
function updateThemeIcon(){themeBtn.textContent=html.dataset.theme==='dark'?'☀️':'🌙'}
updateThemeIcon();
themeBtn.addEventListener('click',()=>{const n=html.dataset.theme==='dark'?'light':'dark';html.dataset.theme=n;localStorage.setItem('fb-theme',n);updateThemeIcon()});
</script>
</body>
</html>
